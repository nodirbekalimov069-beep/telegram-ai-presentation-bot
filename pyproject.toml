[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-ai-presentation-bot"
version = "0.1.0"
description = "Production-ready Telegram bot for AI-generated PPTX and PDF presentations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram>=3.15,<4",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "dramatiq[redis]>=1.17,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.3,<6",
  "reportlab>=4.2,<5",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
  "openai>=2.53.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "modules"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "core", "modules", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "ASYNC230",  # Small local files are intentionally read inside bounded async jobs.
  "ASYNC240",  # pathlib metadata operations are short and local in this project.
  "E501",      # Ruff formatter intentionally does not wrap every long string.
  "RUF001",    # Uzbek text legitimately uses typographic apostrophes.
  "RUF012",    # SQLAlchemy/Pydantic declarative class attributes are intentional.
  "S101",      # Assertions are required in application validation and tests.
  "S104",      # The container API must bind to all interfaces.
  "S314",      # Only internally generated PPTX relationship XML is parsed.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["apps", "core", "modules"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["apps", "core", "modules"]

[tool.coverage.report]
show_missing = true
skip_covered = true
